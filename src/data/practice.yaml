main:
  name: Kerbdrop
  principal: Stephen Maina
  principalTitle: Senior Principal Architect
  tagline: Platform Migration. Legacy Modernization. Event-Driven Data. AI Integration.
  positioning: >-
    Kerbdrop is an independent engineering practice. It exists for one job:
    walking into an organization that's charting its new journey on a platform
    migration, a legacy rewrite, a micro-services modernization, or an AI rollout that needs to hold up in production — and leaving it with working systems and a team that can run
    them. Engagements have a start and an end. No headcount, no ramp-up
    curve, no bench.
  engagementModel: Available for C2C and 1099 engagements — short-term, scoped, and outcome-defined.
  location: Sheboygan, WI · Remote-first
  foundedYear: "2025"
  email: mainacell@gmail.com
  phone: "(920) 441-6874"

  links:
    - label: Email
      url: "mailto:mainacell@gmail.com"
    - label: LinkedIn
      url: "https://www.linkedin.com/in/stephenmainalink"
    - label: GitHub
      url: "https://github.com/akilisha"

  # The cross-case-study thesis, stated once and directly on the homepage.
  thesis:
    eyebrow: The pattern
    heading: Blazing the trail with enterprise solutions.
    body: >-
      I have consistently been building engineering solutions even before the enterprise
      came up with a name for them: COBOL system decomposed into microservices years
      before "AI-assisted modernization" was a category. A CDC platform
      publishing domain-owned events before "data mesh" had a name. A
      tiered, deployment governance model before "platform engineering" and
      "golden paths" were part of the vocabulary. This can't be dismissed as just sheer luck.
      This is being in tune with the nature of solutions that will spring an organization forward.

  # The "Where I work" grid on the homepage. Order here is the display
  # order (fills left-to-right, top-to-bottom in a 2-column grid).
  specializations:
    - title: Platform migration & governance
      detail: >-
        Moving off VMware/Tanzu onto OpenShift or Kubernetes at enterprise
        scale, with the guardrails that keep 3,000+ services from becoming
        3,000 snowflakes.
      client: Discover Financial Services
    - title: Legacy modernization
      detail: >-
        Decomposing mainframe and monolith systems into micro-services, including API
        design, documentation, and access management included — with
        the testing discipline that keeps the rewrite from becoming the
        outage.
      client: WPS Health Solutions
    - title: Event-driven data platforms
      detail: >-
        CDC pipelines and stream processing that give every downstream
        team its own live, domain-owned view of the data — not a shared
        lake.
      client: DAIS Technology
    - title: AI integration for JVM systems
      detail: >-
        Wiring LLMs into production Java services in a way that's
        observable and reliable, not just a demo that calls an API.
      client: Oracle Corporation

